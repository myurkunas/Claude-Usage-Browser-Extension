<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Claude Usage</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    html, body {
      margin: 0;
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: #ffffff;
      color: #2a2928;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: #1f1e1d;
        color: #e8e6e3;
      }
    }
    .wrap { padding: 14px 16px; }
    h1 {
      margin: 0 0 2px;
      font-size: 14px;
      font-weight: 600;
    }
    .ver {
      color: #8f8d89;
      font-size: 11px;
      margin-bottom: 12px;
    }
    p {
      margin: 0 0 12px;
      line-height: 1.45;
    }
    a.btn {
      display: block;
      text-align: center;
      padding: 8px 12px;
      background: #DE7356;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    a.btn:hover { background: #c8624a; }
    .credits {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(127, 127, 127, 0.2);
      color: #8f8d89;
      font-size: 11px;
      text-align: center;
    }
    .credits a {
      color: inherit;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Claude Usage</h1>
    <div class="ver">v0.1.0</div>
    <p>See your Claude usage at a glance, right above the chat input.</p>
    <a class="btn" href="https://buymeacoffee.com/yurkunas" target="_blank" rel="noopener noreferrer">Buy me a coffee ☕</a>
    <div class="credits">Made by <a href="https://yurkunas.com" target="_blank" rel="noopener noreferrer">Matthew Yurkunas</a></div>
  </div>
</body>
</html>
